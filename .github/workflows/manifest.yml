name: Model manifest

# Generates src-tauri/models.json on a GitHub runner (the build container
# cannot reach huggingface.co), commits it back, then runs the bench.
on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/gen-model-manifest.py
      - .github/workflows/manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    name: Generate models.json
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Generate manifest
        run: python3 scripts/gen-model-manifest.py src-tauri/models.json src-tauri/resources/silero_vad.onnx

      - name: Commit manifest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/models.json src-tauri/resources/silero_vad.onnx
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "P0.4/P1.15: generate src-tauri/models.json and bundle silero_vad.onnx from CI [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" \
              && echo "changed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep $((i * 10))
          done
          exit 1

  bench:
    needs: manifest
    if: needs.manifest.outputs.changed == 'true'
    uses: ./.github/workflows/bench.yml
