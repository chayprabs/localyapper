name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: macos-aarch64
          - name: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: macos-x64
          - name: Linux
            platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles deb,appimage
            artifact: linux-x64
          - name: Windows
            platform: windows-latest
            rust_targets: ""
            args: --bundles nsis
            artifact: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust with targets
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('LocalYapper {0}', github.ref_name) || '' }}
          releaseBody: |
            LocalYapper release build.

            See docs/RELEASE_NOTES_v0.1.0.md for release notes.
          releaseDraft: true
          prerelease: false

      - name: Prepare artifact paths
        id: artifact-paths
        if: ${{ steps.build-tauri.outputs.artifactPaths != '' && steps.build-tauri.outputs.artifactPaths != '[]' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = (process.env.ARTIFACT_PATHS || '').trim();
          const paths = raw ? JSON.parse(raw) : [];
          if (paths.length > 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths<<EOF\n${paths.join('\n')}\nEOF\n`);
          }
          NODE
        env:
          ARTIFACT_PATHS: ${{ steps.build-tauri.outputs.artifactPaths }}

      - name: Upload workflow artifacts
        if: ${{ steps.artifact-paths.outputs.paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: localyapper-${{ matrix.artifact }}
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: error
