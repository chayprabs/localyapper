[package]
name = "localyapper"
version = "0.1.0"
description = "Local-first voice dictation desktop app"
authors = ["Chaitanya"]
license = "MIT"
edition = "2021"

[lib]
name = "localyapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["stream", "json"] }
cpal = "0.15"
sherpa-onnx = "1.12"
arboard = "3"
enigo = "0.2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

# Release profile tuned for a small, fast binary. Panics are aborts because
# the app does not unwind across the sherpa-onnx FFI boundary; aborting is
# safer and shrinks the binary by removing unwind tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
