[package]
name = "localyapper"
version = "1.0.0"
description = "Local-first voice dictation desktop app"
authors = ["Chaitanya"]
license = "MIT"
edition = "2021"
default-run = "localyapper"

[lib]
name = "localyapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["sherpa-static"]
# Static sherpa-onnx (release builds, CI). Downloads the prebuilt archive
# from the sherpa-onnx GitHub release, or reads SHERPA_ONNX_ARCHIVE_DIR.
sherpa-static = ["sherpa-onnx/static"]
# Shared sherpa-onnx, for hosts that cannot fetch the static archive.
# Point SHERPA_ONNX_LIB_DIR at a folder with libsherpa-onnx-c-api and
# libonnxruntime (for example from the sherpa-onnx-core wheel).
sherpa-shared = ["sherpa-onnx/shared"]
# Test-only hooks: fake audio source and the controller test channel.
# Never enabled in release builds.
test-hooks = []

# Smoke-test helper: a native window with one text field (plan 8A).
[[bin]]
name = "text_target"
path = "tests/helpers/text_target/main.rs"
required-features = ["test-hooks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
cpal = "0.15"
sherpa-onnx = { version = "2.0", default-features = false }
arboard = "3"
enigo = "0.2"
futures-util = "0.3"
# mimalloc tames fragmentation from sherpa-onnx's short-burst alloc/free
# pattern. The system allocator on Windows in particular tends to hold on
# to freed ONNX scratch space, which would defeat the idle-unload work.
ringbuf = "0.4"
# Model download verification (plan P4.2).
sha2 = "0.10"
mimalloc = { version = "0.1", default-features = false }
# mi_collect() after model eviction (plan P1.13).
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland: clipboard through the data-control protocol, keys through the
# virtual keyboard protocol. X11 keeps enigo's default xdo back end.
arboard = { version = "3", features = ["wayland-data-control"] }
enigo = { version = "0.2", features = ["wayland"] }
# Modifier state and the active window on X11 without external tools.
x11-dl = "2"
# GTK text view for the smoke-test text target (already built by tao).
gtk = "0.18"
# Wayland global shortcuts through the xdg-desktop-portal.
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
block2 = "0.6"
objc2-foundation = "0.3"
# Non-activating NSPanel for the overlay (plan P3.3).
tauri-nspanel = "2.1"

# Release profile tuned for a small, fast binary. Panics are aborts because
# the app does not unwind across the sherpa-onnx FFI boundary; aborting is
# safer and shrinks the binary by removing unwind tables.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
